# E2E Conflict Test Configuration
# Format: module_a + module_b | verify_command
# Tests that overlapping modules can coexist in the same environment.

# Both install curl and git via apt — second install should be a no-op
base/essentials + cli/essentials  | curl --version && git --version && jq --version && tmux -V

# Python + Node.js — both modify shell rc files and use different version managers
development/python + development/nodejs | python3 --version && pip3 --version && node --version && npm --version

# Go + Rust — both add to PATH via .bashrc
development/go + development/rust | /usr/local/go/bin/go version && bash -lc 'rustc --version'

# Neovim + Helix — both are terminal editors, may compete for alternatives
editors/neovim + editors/helix | nvim --version && hx --version

# Terraform + Helm — both DevOps CLI tools installing to /usr/local/bin
devops/terraform + devops/helm | terraform version && helm version --short

# AWS CLI + GitHub CLI — both add apt repos, both CLI tools in /usr/local/bin
devops/awscli + cli/github-cli | aws --version && gh --version

# Ruby + Python — both are scripting languages, both install via apt
development/ruby + development/python | ruby --version && python3 --version
